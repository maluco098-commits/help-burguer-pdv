services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: helpburguer
      POSTGRES_USER: helpburguer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-helpburguer-local}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpburguer -d helpburguer"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
